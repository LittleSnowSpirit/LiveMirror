name: LiveMirror Full Checks

on:
  workflow_dispatch:
  schedule:
    # Runs at 02:00 Asia/Shanghai.
    - cron: "0 18 * * *"

jobs:
  full-backend:
    name: Full Backend Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: ./backend
        run: python -m pip install -r requirements.txt

      - name: Install browser test dependencies
        working-directory: ./tests
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run full pytest suite
        env:
          DATABASE_URL: sqlite://
          TRANSCRIPTION_PROVIDER: mock
          LIVEMIRROR_RUN_EXPERIMENTAL_TESTS: "1"
        run: python -m pytest -q -p no:cacheprovider

  full-frontend:
    name: Full Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build
        working-directory: ./frontend
        run: npm run build

  core-browser-flow:
    name: Core Browser Flow
    runs-on: ubuntu-latest
    needs: [full-backend, full-frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install browser test dependencies
        working-directory: ./tests
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run core browser flow
        env:
          TRANSCRIPTION_PROVIDER: mock
        run: python -m pytest tests/e2e_core -q -p no:cacheprovider
