name: LiveMirror Core Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-core:
    name: Backend Core API
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: ./backend
        run: python -m pip install -r requirements.txt

      - name: Validate Alembic migrations
        working-directory: ./backend
        run: |
          python -c "
          from alembic.config import Config
          from alembic import command
          cfg = Config('alembic.ini')
          cfg.set_main_option('script_location', 'migrations')
          cfg.set_main_option('sqlalchemy.url', 'sqlite:///test_migration_check.db')
          command.upgrade(cfg, 'head')
          command.downgrade(cfg, 'base')
          import os; os.remove('test_migration_check.db')
          print('Migrations validated: upgrade and downgrade succeeded.')
          "

      - name: Run core API tests
        env:
          DATABASE_URL: sqlite://
          TRANSCRIPTION_PROVIDER: mock
        run: python -m pytest backend/tests/test_core_api.py -q -p no:cacheprovider

  frontend-core:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Build
        working-directory: ./frontend
        run: npm run build

  e2e-core:
    name: Browser Core Flow
    runs-on: ubuntu-latest
    needs: [backend-core, frontend-core]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: python -m pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install browser test dependencies
        working-directory: ./tests
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run core browser flow
        env:
          TRANSCRIPTION_PROVIDER: mock
        run: python -m pytest tests/e2e_core -q -p no:cacheprovider
