[pytest]
# 测试文件匹配
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试支持
asyncio_mode = auto

# 命令行选项
addopts = 
    -v
    --tb=short
    --html=report.html
    --self-contained-html
    --cov=../backend
    --cov-report=html:coverage_html

# 标记
markers =
    e2e: End-to-end tests (requires running frontend)
    api: API integration tests
    slow: Slow running tests
    upload: Upload related tests
    report: Report related tests
    smoke: Quick smoke tests

# 超时设置 (需要 pytest-timeout 插件)
timeout = 300
timeout_method = thread

# 日志
log_cli = true
log_cli_level = INFO
