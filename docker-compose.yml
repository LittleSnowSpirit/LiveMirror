services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: livemirror
      POSTGRES_USER: livemirror
      POSTGRES_PASSWORD: livemirror
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U livemirror"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://livemirror:livemirror@postgres:5432/livemirror
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
    ports:
      - "8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  celery-worker:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://livemirror:livemirror@postgres:5432/livemirror
      REDIS_URL: redis://redis:6379/0
    command: celery -A celery_app worker --loglevel=info

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
