[pytest]
testpaths =
    backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q -p no:cacheprovider
asyncio_mode = auto
markers =
    core: current supported LiveMirror core workflow
    e2e: browser-based end-to-end tests
    experimental: retained legacy or experimental modules
