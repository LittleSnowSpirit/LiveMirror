<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveMirror 语音控制演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 10px;
      font-size: 32px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    .status-bar {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
      display: flex;
      justify-content: space-around;
      flex-wrap: wrap;
      gap: 15px;
    }

    .status-item {
      text-align: center;
    }

    .status-label {
      display: block;
      font-size: 12px;
      color: #999;
      margin-bottom: 5px;
    }

    .status-value {
      display: block;
      font-size: 18px;
      font-weight: bold;
      color: #333;
    }

    .status-value.active {
      color: #667eea;
    }

    .status-value.error {
      color: #f87171;
    }

    .control-area {
      text-align: center;
      margin-bottom: 30px;
    }

    .voice-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 40px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .voice-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 15px 40px rgba(102, 126, 234, 0.6);
    }

    .voice-btn:active {
      transform: scale(0.95);
    }

    .voice-btn.listening {
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
      }
      50% {
        box-shadow: 0 10px 50px rgba(102, 126, 234, 0.8);
      }
    }

    .waveform {
      display: none;
      justify-content: center;
      gap: 5px;
      height: 40px;
      align-items: center;
      margin: 20px 0;
    }

    .waveform.active {
      display: flex;
    }

    .wave {
      width: 6px;
      background: #667eea;
      border-radius: 3px;
      animation: wave 1s ease-in-out infinite;
    }

    .wave:nth-child(1) { height: 20px; animation-delay: 0s; }
    .wave:nth-child(2) { height: 30px; animation-delay: 0.1s; }
    .wave:nth-child(3) { height: 40px; animation-delay: 0.2s; }
    .wave:nth-child(4) { height: 30px; animation-delay: 0.3s; }
    .wave:nth-child(5) { height: 20px; animation-delay: 0.4s; }

    @keyframes wave {
      0%, 100% { transform: scaleY(1); }
      50% { transform: scaleY(1.5); }
    }

    .transcript {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      min-height: 80px;
    }

    .transcript-label {
      font-size: 14px;
      color: #999;
      margin-bottom: 10px;
    }

    .transcript-text {
      font-size: 18px;
      color: #333;
      font-weight: 500;
    }

    .commands-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 30px;
    }

    .command-card {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 15px;
      border-left: 4px solid #667eea;
    }

    .command-category {
      font-size: 12px;
      color: #999;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .command-keywords {
      font-size: 14px;
      color: #333;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .command-desc {
      font-size: 12px;
      color: #666;
    }

    .history-section {
      margin-top: 30px;
      padding-top: 30px;
      border-top: 2px solid #f0f0f0;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .history-list {
      list-style: none;
      max-height: 200px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 10px;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-input {
      color: #666;
      font-style: italic;
    }

    .history-command {
      color: #667eea;
      font-weight: bold;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-secondary {
      background: #f0f0f0;
      color: #333;
    }

    .btn-secondary:hover {
      background: #e0e0e0;
    }

    .btn-danger {
      background: #f87171;
      color: white;
    }

    .btn-danger:hover {
      background: #f05555;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-offline {
      background: #fbbf24;
      color: white;
    }

    .badge-supported {
      background: #4ade80;
      color: white;
    }

    .badge-unsupported {
      background: #f87171;
      color: white;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎤 LiveMirror 语音控制演示</h1>
    <p class="subtitle">测试语音识别和命令功能</p>

    <div class="status-bar">
      <div class="status-item">
        <span class="status-label">浏览器支持</span>
        <span class="status-value" id="supportStatus">检测中...</span>
      </div>
      <div class="status-item">
        <span class="status-label">当前状态</span>
        <span class="status-value" id="listenStatus">⚪ 已停止</span>
      </div>
      <div class="status-item">
        <span class="status-label">工作模式</span>
        <span class="status-value" id="modeStatus">☁️ 在线</span>
      </div>
    </div>

    <div class="control-area">
      <button class="voice-btn" id="voiceBtn" title="点击开始/停止语音">
        🎤
      </button>
      <p style="margin-top: 15px; color: #666;">点击麦克风按钮开始语音识别</p>
    </div>

    <div class="waveform" id="waveform">
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
      <div class="wave"></div>
    </div>

    <div class="transcript">
      <div class="transcript-label">识别结果:</div>
      <div class="transcript-text" id="transcriptText">等待语音输入...</div>
    </div>

    <div class="transcript">
      <div class="transcript-label">匹配命令:</div>
      <div class="transcript-text" id="commandText">-</div>
    </div>

    <div class="history-section">
      <div class="history-header">
        <h3>命令历史</h3>
        <button class="btn btn-danger" id="clearBtn">清除历史</button>
      </div>
      <ul class="history-list" id="historyList">
        <li class="history-item">
          <span>暂无历史记录</span>
        </li>
      </ul>
    </div>

    <h3 style="margin-top: 30px; margin-bottom: 15px;">可用命令</h3>
    <div class="commands-grid" id="commandsGrid">
      <!-- 命令卡片将通过 JS 动态生成 -->
    </div>
  </div>

  <script type="module">
    // 简化的语音控制实现（用于演示）
    class SimpleVoiceController {
      constructor() {
        this.recognition = null
        this.isListening = false
        this.isSupported = false
        this.isOffline = false
        this.commandHistory = []
        this.commands = this.loadCommands()
        this.init()
      }

      loadCommands() {
        return {
          control: {
            start: { keywords: ['开始', '启动', '开启'], action: 'start', description: '开始语音识别' },
            stop: { keywords: ['停止', '关闭', '退出'], action: 'stop', description: '停止语音识别' },
            toggle: { keywords: ['切换', '开关'], action: 'toggle', description: '切换语音识别' }
          },
          navigation: {
            home: { keywords: ['首页', '主页'], action: 'navigate', description: '返回首页' },
            dashboard: { keywords: ['仪表盘', '看板'], action: 'navigate', description: '打开仪表盘' },
            reports: { keywords: ['报告', '报表'], action: 'navigate', description: '打开报告' },
            settings: { keywords: ['设置', '配置'], action: 'navigate', description: '打开设置' }
          },
          search: {
            search: { keywords: ['搜索', '查找'], action: 'search', description: '搜索数据' },
            search_report: { keywords: ['搜索报告', '找报告'], action: 'search', description: '搜索报告' }
          },
          shortcuts: {
            refresh: { keywords: ['刷新', '更新'], action: 'refresh', description: '刷新页面' },
            help: { keywords: ['帮助', '怎么用'], action: 'help', description: '显示帮助' },
            fullscreen: { keywords: ['全屏', '放大'], action: 'fullscreen', description: '全屏模式' }
          }
        }
      }

      init() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition
        
        if (SpeechRecognition) {
          this.isSupported = true
          this.recognition = new SpeechRecognition()
          this.recognition.continuous = false
          this.recognition.interimResults = true
          this.recognition.lang = 'zh-CN'

          this.recognition.onstart = () => {
            this.isListening = true
            this.updateUI()
            this.speak('正在聆听')
          }

          this.recognition.onend = () => {
            this.isListening = false
            this.updateUI()
          }

          this.recognition.onresult = (event) => {
            const transcript = Array.from(event.results)
              .map(result => result[0].transcript)
              .join('')
            
            document.getElementById('transcriptText').textContent = transcript
            
            const command = this.matchCommand(transcript)
            if (command) {
              document.getElementById('commandText').textContent = `${command.key} (置信度：${Math.round(command.confidence * 100)}%)`
              this.addToHistory(transcript, command)
              this.speak(`执行：${command.key}`)
              this.executeCommand(command)
            } else {
              document.getElementById('commandText').textContent = '未匹配到命令'
            }
          }

          this.recognition.onerror = (event) => {
            console.error('语音识别错误:', event.error)
            if (event.error === 'network') {
              this.isOffline = true
              this.updateUI()
            }
          }
        } else {
          this.isSupported = false
          this.isOffline = true
        }

        this.updateUI()
        this.renderCommands()
      }

      matchCommand(input) {
        const normalizedInput = input.toLowerCase().trim()
        const categories = ['control', 'navigation', 'search', 'shortcuts']

        for (const category of categories) {
          const cmds = this.commands[category]
          if (!cmds) continue

          for (const [key, cmd] of Object.entries(cmds)) {
            for (const keyword of cmd.keywords) {
              if (normalizedInput.includes(keyword.toLowerCase())) {
                return {
                  category,
                  key,
                  action: cmd.action,
                  confidence: normalizedInput === keyword.toLowerCase() ? 1.0 : 0.8
                }
              }
            }
          }
        }

        return null
      }

      executeCommand(command) {
        console.log('执行命令:', command)
        
        switch (command.action) {
          case 'start':
            this.start()
            break
          case 'stop':
            this.stop()
            break
          case 'toggle':
            this.toggle()
            break
          case 'fullscreen':
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen()
            } else {
              document.exitFullscreen()
            }
            break
        }
      }

      start() {
        if (this.isSupported && this.recognition) {
          this.recognition.start()
          return true
        }
        return false
      }

      stop() {
        if (this.recognition && this.isListening) {
          this.recognition.stop()
          return true
        }
        return false
      }

      toggle() {
        return this.isListening ? this.stop() : this.start()
      }

      addToHistory(input, command) {
        this.commandHistory.unshift({
          timestamp: Date.now(),
          input,
          command
        })
        
        if (this.commandHistory.length > 10) {
          this.commandHistory.pop()
        }

        this.renderHistory()
      }

      clearHistory() {
        this.commandHistory = []
        this.renderHistory()
      }

      renderHistory() {
        const list = document.getElementById('historyList')
        
        if (this.commandHistory.length === 0) {
          list.innerHTML = '<li class="history-item"><span>暂无历史记录</span></li>'
          return
        }

        list.innerHTML = this.commandHistory.map(item => `
          <li class="history-item">
            <span class="history-input">${item.input}</span>
            <span class="history-command">${item.command.key}</span>
          </li>
        `).join('')
      }

      renderCommands() {
        const grid = document.getElementById('commandsGrid')
        const categoryNames = {
          control: '控制命令',
          navigation: '导航命令',
          search: '搜索命令',
          shortcuts: '快捷命令'
        }

        let html = ''
        Object.entries(this.commands).forEach(([category, cmds]) => {
          Object.entries(cmds).forEach(([key, cmd]) => {
            html += `
              <div class="command-card">
                <div class="command-category">${categoryNames[category]}</div>
                <div class="command-keywords">${cmd.keywords.join(' / ')}</div>
                <div class="command-desc">${cmd.description}</div>
              </div>
            `
          })
        })

        grid.innerHTML = html
      }

      updateUI() {
        const btn = document.getElementById('voiceBtn')
        const listenStatus = document.getElementById('listenStatus')
        const modeStatus = document.getElementById('modeStatus')
        const waveform = document.getElementById('waveform')
        const supportStatus = document.getElementById('supportStatus')

        // 支持状态
        if (this.isSupported) {
          supportStatus.innerHTML = '<span class="badge badge-supported">✓ 支持</span>'
        } else {
          supportStatus.innerHTML = '<span class="badge badge-unsupported">✗ 不支持</span>'
        }

        // 聆听状态
        if (this.isListening) {
          listenStatus.textContent = '🔴 聆听中'
          listenStatus.classList.add('active')
          btn.classList.add('listening')
          waveform.classList.add('active')
        } else {
          listenStatus.textContent = '⚪ 已停止'
          listenStatus.classList.remove('active')
          btn.classList.remove('listening')
          waveform.classList.remove('active')
        }

        // 模式状态
        if (this.isOffline) {
          modeStatus.innerHTML = '<span class="badge badge-offline">📴 离线</span>'
        } else {
          modeStatus.textContent = '☁️ 在线'
        }
      }

      speak(text) {
        if ('speechSynthesis' in window) {
          const utterance = new SpeechSynthesisUtterance(text)
          utterance.lang = 'zh-CN'
          window.speechSynthesis.speak(utterance)
        }
      }
    }

    // 初始化演示
    const controller = new SimpleVoiceController()

    // 绑定按钮事件
    document.getElementById('voiceBtn').addEventListener('click', () => {
      controller.toggle()
    })

    document.getElementById('clearBtn').addEventListener('click', () => {
      controller.clearHistory()
    })

    // 键盘快捷键
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && e.target === document.body) {
        e.preventDefault()
        controller.toggle()
      }
    })

    console.log('语音控制演示已加载')
    console.log('提示：按空格键快速启动/停止语音识别')
  </script>
</body>
</html>
