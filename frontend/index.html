<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#667eea" />
    <meta name="description" content="LiveMirror - 直播内容智能分析与优化助手" />
    <meta name="keywords" content="直播，分析，优化，工具，PWA" />
    <meta name="author" content="LiveMirror Team" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiveMirror" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- 安全区域适配 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- 主题色 -->
    <meta name="theme-color" content="#667eea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)" />
    
    <!-- 分享优化 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LiveMirror" />
    <meta property="og:description" content="直播内容智能分析与优化助手" />
    
    <title>LiveMirror</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    
  </body>
</html>
