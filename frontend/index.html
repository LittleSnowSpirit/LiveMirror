<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="LiveMirror - 直播内容智能分析与优化助手" />
    <meta name="keywords" content="直播，分析，优化，工具，PWA" />
    <meta name="author" content="LiveMirror Team" />

    <!-- Fonts: DM Sans (body) + Lora (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    
    <!-- PWA: manifest link is injected by vite-plugin-pwa -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LiveMirror" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- 分享优化 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="LiveMirror" />
    <meta property="og:description" content="直播内容智能分析与优化助手" />
    
    <title>LiveMirror</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    
  </body>
</html>
