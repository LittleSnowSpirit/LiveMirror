<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LiveMirror 数据大屏 - 演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
    }

    .status.connected .status-dot {
      background: #2ed573;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .metric-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    .metric-card.primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      grid-column: span 2;
    }

    .metric-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .metric-label {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 0.5rem;
    }

    .metric-value {
      font-size: 3rem;
      font-weight: bold;
    }

    .metric-sub {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 0.5rem;
    }

    .controls {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.8);
    }

    .log-panel {
      background: rgba(0, 0, 0, 0.3);
      border-radius: 12px;
      padding: 1.5rem;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.85rem;
    }

    .log-entry {
      padding: 0.25rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .log-entry:last-child {
      border-bottom: none;
    }

    .log-time {
      color: rgba(255, 255, 255, 0.5);
      margin-right: 0.5rem;
    }

    .layout-selector {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .layout-btn {
      padding: 0.5rem 1rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .layout-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-color: transparent;
    }

    @media (max-width: 768px) {
      .metric-card.primary {
        grid-column: span 1;
      }

      .metric-value {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎬 LiveMirror 数据大屏</h1>
      <p style="color: rgba(255,255,255,0.6); margin-bottom: 1rem;">实时直播数据监控演示</p>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="status-text">连接中...</span>
      </div>
    </header>

    <div class="layout-selector">
      <button class="layout-btn active" data-layout="default">默认布局</button>
      <button class="layout-btn" data-layout="focus-gmv">GMV 焦点</button>
      <button class="layout-btn" data-layout="interaction">互动优先</button>
      <button class="layout-btn" data-layout="minimal">极简模式</button>
    </div>

    <div class="controls">
      <button class="btn btn-primary" onclick="toggleFullscreen()">🖥️ 全屏</button>
      <button class="btn" onclick="exportData()">📥 导出数据</button>
      <button class="btn" onclick="takeScreenshot()">📸 截图</button>
      <button class="btn btn-danger" onclick="resetData()">🔄 重置数据</button>
    </div>

    <div class="dashboard-grid" id="dashboard">
      <div class="metric-card primary">
        <div class="metric-icon">💰</div>
        <div class="metric-label">总成交额 (GMV)</div>
        <div class="metric-value" id="gmv">¥0</div>
        <div class="metric-sub">实时增长中</div>
      </div>

      <div class="metric-card">
        <div class="metric-icon">👥</div>
        <div class="metric-label">当前观看</div>
        <div class="metric-value" id="viewers">0</div>
        <div class="metric-sub">峰值：<span id="peak-viewers">0</span></div>
      </div>

      <div class="metric-card">
        <div class="metric-icon">📦</div>
        <div class="metric-label">订单数</div>
        <div class="metric-value" id="orders">0</div>
        <div class="metric-sub">转化率：<span id="conversion-rate">0</span>%</div>
      </div>

      <div class="metric-card">
        <div class="metric-icon">❤️</div>
        <div class="metric-label">点赞</div>
        <div class="metric-value" id="likes">0</div>
      </div>

      <div class="metric-card">
        <div class="metric-icon">💬</div>
        <div class="metric-label">评论</div>
        <div class="metric-value" id="comments">0</div>
      </div>

      <div class="metric-card">
        <div class="metric-icon">🔗</div>
        <div class="metric-label">分享</div>
        <div class="metric-value" id="shares">0</div>
      </div>

      <div class="metric-card">
        <div class="metric-icon">⏱️</div>
        <div class="metric-label">平均观看时长</div>
        <div class="metric-value" id="avg-watch-time">0 分 0 秒</div>
      </div>
    </div>

    <div class="log-panel">
      <div style="margin-bottom: 0.5rem; font-weight: bold;">📋 实时日志</div>
      <div id="log-container"></div>
    </div>
  </div>

  <script>
    let ws = null;
    let currentLayout = 'default';

    // 连接 WebSocket
    function connectWebSocket() {
      const wsUrl = `ws://${window.location.host}/api/dashboard/ws`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        log('WebSocket 连接成功');
        document.getElementById('status').classList.add('connected');
        document.getElementById('status-text').textContent = '实时连接中';
      };

      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === 'update' || message.type === 'reset') {
          updateDashboard(message.data);
          log(`数据更新：GMV ¥${message.data.gmv.toLocaleString()}, 观看 ${message.data.viewers}人`);
        }
      };

      ws.onclose = () => {
        log('WebSocket 断开，3 秒后重连...');
        document.getElementById('status').classList.remove('connected');
        document.getElementById('status-text').textContent = '未连接';
        setTimeout(connectWebSocket, 3000);
      };

      ws.onerror = (error) => {
        log('WebSocket 错误：' + error);
      };
    }

    // 更新仪表盘
    function updateDashboard(data) {
      document.getElementById('gmv').textContent = '¥' + formatNumber(data.gmv);
      document.getElementById('viewers').textContent = formatNumber(data.viewers);
      document.getElementById('peak-viewers').textContent = formatNumber(data.peak_viewers);
      document.getElementById('orders').textContent = formatNumber(data.orders);
      document.getElementById('conversion-rate').textContent = data.conversion_rate;
      document.getElementById('likes').textContent = formatNumber(data.likes);
      document.getElementById('comments').textContent = formatNumber(data.comments);
      document.getElementById('shares').textContent = formatNumber(data.shares);
      document.getElementById('avg-watch-time').textContent = formatTime(data.avg_watch_time);
    }

    // 格式化数字
    function formatNumber(num) {
      if (num >= 10000) {
        return (num / 10000).toFixed(1) + '万';
      }
      return num.toLocaleString('zh-CN');
    }

    // 格式化时间
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}分${secs}秒`;
    }

    // 日志
    function log(message) {
      const container = document.getElementById('log-container');
      const entry = document.createElement('div');
      entry.className = 'log-entry';
      const time = new Date().toLocaleTimeString('zh-CN');
      entry.innerHTML = `<span class="log-time">[${time}]</span>${message}`;
      container.appendChild(entry);
      container.scrollTop = container.scrollHeight;

      // 限制日志数量
      while (container.children.length > 50) {
        container.removeChild(container.firstChild);
      }
    }

    // 全屏
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        log('进入全屏模式');
      } else {
        document.exitFullscreen();
        log('退出全屏模式');
      }
    }

    // 导出数据
    function exportData() {
      const data = {
        gmv: document.getElementById('gmv').textContent,
        viewers: document.getElementById('viewers').textContent,
        orders: document.getElementById('orders').textContent,
        timestamp: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `dashboard_export_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
      log('数据已导出');
    }

    // 截图
    function takeScreenshot() {
      log('截图功能需要 html2canvas 库，生产环境已集成');
      alert('截图功能演示：在生产环境中，将使用 html2canvas 库进行截图');
    }

    // 重置数据
    function resetData() {
      if (confirm('确定要重置所有数据吗？')) {
        fetch('/api/dashboard/data/reset', { method: 'POST' })
          .then(res => res.json())
          .then(data => {
            log('数据已重置');
          })
          .catch(err => {
            log('重置失败：' + err);
          });
      }
    }

    // 布局切换
    document.querySelectorAll('.layout-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.layout-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentLayout = btn.dataset.layout;
        log(`切换到布局：${btn.textContent}`);
        
        // 这里可以添加实际的布局切换逻辑
        const dashboard = document.getElementById('dashboard');
        dashboard.style.opacity = '0.5';
        setTimeout(() => {
          dashboard.style.opacity = '1';
        }, 300);
      });
    });

    // 初始化
    log('页面加载完成');
    connectWebSocket();
  </script>
</body>
</html>
