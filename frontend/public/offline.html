<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线 - LiveMirror</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: white;
    }
    
    .offline-container {
      text-align: center;
      max-width: 400px;
    }
    
    .offline-icon {
      font-size: 80px;
      margin-bottom: 24px;
      opacity: 0.9;
    }
    
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    
    p {
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 32px;
      opacity: 0.9;
    }
    
    .status-indicator {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.2);
      padding: 12px 24px;
      border-radius: 50px;
      margin-bottom: 24px;
    }
    
    .status-dot {
      width: 10px;
      height: 10px;
      background: #fc8181;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .retry-button {
      background: white;
      color: #667eea;
      border: none;
      padding: 16px 48px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 16px;
    }
    
    .retry-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }
    
    .tips {
      background: rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    
    .tips strong {
      display: block;
      margin-bottom: 8px;
    }
    
    .cached-content {
      margin-top: 32px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
    }
    
    .cached-content h2 {
      font-size: 18px;
      margin-bottom: 16px;
    }
    
    .cached-list {
      text-align: left;
      list-style: none;
    }
    
    .cached-list li {
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 14px;
    }
    
    .cached-list li:last-child {
      border-bottom: none;
    }
    
    @media (max-width: 768px) {
      .offline-icon {
        font-size: 60px;
      }
      
      h1 {
        font-size: 24px;
      }
      
      p {
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="offline-container">
    <div class="offline-icon">📴</div>
    
    <div class="status-indicator">
      <div class="status-dot"></div>
      <span>当前离线</span>
    </div>
    
    <h1>网络连接已断开</h1>
    <p>
      您目前处于离线状态，部分功能可能无法使用。<br>
      请检查网络连接后重试。
    </p>
    
    <button class="retry-button" onclick="window.location.reload()">
      重新连接
    </button>
    
    <div class="tips">
      <strong>💡 提示</strong>
      LiveMirror 支持离线使用部分功能。<br>
      已缓存的内容仍然可以访问。
    </div>
    
    <div class="cached-content">
      <h2>📦 可离线访问的内容</h2>
      <ul class="cached-list">
        <li>✓ 已缓存的页面</li>
        <li>✓ 本地设置和偏好</li>
        <li>✓ 已保存的报告</li>
        <li>✓ 历史分析记录</li>
      </ul>
    </div>
  </div>
  
  <script>
    // 监听网络状态变化
    function updateOnlineStatus() {
      if (navigator.onLine) {
        // 网络恢复，自动刷新
        setTimeout(() => {
          window.location.reload();
        }, 1000);
      }
    }
    
    window.addEventListener('online', updateOnlineStatus);
    window.addEventListener('offline', updateOnlineStatus);
    
    // 检查 Service Worker 状态
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then((registration) => {
        console.log('Service Worker 已就绪:', registration.scope);
      });
    }
    
    // 显示当前网络状态
    console.log('当前网络状态:', navigator.onLine ? '在线' : '离线');
  </script>
</body>
</html>
